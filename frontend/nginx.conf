server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # il mime.types di nginx non conosce .mjs: senza questo il worker di pdf.js
  # arriva come application/octet-stream e il browser si rifiuta di eseguirlo
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
  }

  # SPA: le rotte di react-router (/chat, /documents, ...) ricadono su index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # gli asset di Vite hanno l'hash nel nome: si possono tenere in cache a lungo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
