server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: le rotte di react-router (/chat, /documents, ...) ricadono su index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # gli asset di Vite hanno l'hash nel nome: si possono tenere in cache a lungo
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
